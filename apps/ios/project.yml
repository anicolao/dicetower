name: DiceTower
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  DiceCaptureCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  DiceTower:
    type: application
    platform: iOS
    sources:
      - path: DiceTower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.boardgamescafe.dicetower
        PRODUCT_NAME: DiceTower
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: DiceTower/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DiceCaptureCore
  DiceTowerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DiceTowerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.boardgamescafe.dicetower.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: DiceTower
    dependencies:
      - target: DiceTower
schemes:
  DiceTower:
    build:
      targets:
        DiceTower: all
        DiceTowerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      debugEnabled: false
      targets:
        - DiceTowerUITests
    archive:
      config: Release
